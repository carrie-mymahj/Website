document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — rounded frame: everything softens, small controls go pill — */\n.card, .dialog { border-radius: calc(var(--radius-lg) * 1.15); }\n.btn, .tag, .seg, .input { border-radius: 99 %;\n  font-display: swap;\n  src: url(\"c589845d-dd73-450f-bb8c-010c87ca8dbf\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; background: #fdfdfb; font-family: 'Nunito Sans', system-ui, sans-serif; }\n  a { color: #c93a5f; }\n  a:hover { color: #ad3151; }\n  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 60% { transform: scale(1.08); opacity: 1 } 100% { transform: scale(1) } }\n  @keyframes fall { 0% { transform: translateY(-40px) rotate(0deg); opacity: 0 } 15% { opacity: 1 } 100% { transform: translateY(560px) rotate(320deg); opacity: 0 } }\n  @keyframes sweep { 0% { transform: translateY(-110px) } 100% { transform: translateY(110px) } }\n  @keyframes rise { 0% { transform: translateY(14px); opacity: 0 } 100% { transform: translateY(0); opacity: 1 } }\n  @keyframes grow { 0% { transform: scale(.9) rotate(-3deg); opacity: 0 } 100% { transform: scale(1) rotate(0); opacity: 1 } }\n  @keyframes bob { 0% { transform: translateY(0) } 100% { transform: translateY(-6px) } }\n\n  /* Phone: just the app, edge to edge. The website shows on wide screens. */\n  html, body { height: 100%; margin: 0; overflow: hidden; background: #fdfdfb; }\n  #pageWrap { padding: 0 !important; gap: 0 !important; min-height: 100% !important; }\n  #siteTop, #siteFoot, #sideNotes, #fakeStatus { display: none !important; }\n  #phoneRow { gap: 0 !important; width: 100% !important; height: 100vh !important; height: 100dvh !important; flex-wrap: nowrap !important; }\n  #phoneShell {\n    width: 100% !important; max-width: 100% !important;\n    height: 100vh !important; height: 100dvh !important;\n    border-radius: 0 !important; padding: 0 !important;\n    box-shadow: none !important; background: #fdfdfb !important;\n  }\n  #phoneScreen { border-radius: 0 !important; }\n  #screenScroll { -webkit-overflow-scrolling: touch; }\n\n  /* Wide screen: site on top, the app in a phone frame. */\n  @media (min-width: 1000px) {\n    html, body { height: auto; overflow: visible; }\n    #pageWrap { padding: 32px 40px 0 !important; gap: 72px !important; min-height: 100vh !important; }\n    #siteTop { padding: 0; display: flex !important; }\n    #siteFoot { padding: 8px 0 40px; display: flex !important; }\n    #sideNotes, #fakeStatus { display: flex !important; }\n    #phoneRow { gap: 64px !important; width: auto !important; height: auto !important; flex-wrap: wrap !important; }\n    #phoneShell {\n      width: 390px !important; max-width: 390px !important; height: 844px !important;\n      border-radius: 54px !important; padding: 11px !important;\n      box-shadow: 0 20px 44px rgba(36,48,77,.18) !important; background: #24304d !important;\n    }\n    #phoneScreen { border-radius: 44px !important; }\n  }\n<\u002Fstyle>\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n<meta name=\"apple-mobile-web-app-title\" content=\"My Mahj Card\">\n<meta name=\"theme-color\" content=\"#1f6b47\">\n<link rel=\"apple-touch-icon\" href=\"/icon.png\">\n<\u002Fhelmet>\n\n\n\n<div id=\"pageWrap\" style=\"min-height: 100vh; background: #fdfdfb; color: #24304d; font-family: 'Nunito Sans', system-ui, sans-serif; padding: 48px 40px 64px; display: flex; flex-direction: column; align-items: center; gap: 34px;\">\n\n  <div id=\"siteTop\" style=\"width: 100%; max-width: 1080px; display: flex; flex-direction: column; gap: 64px;\">\n\n    <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;\">\n      <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <span style=\"width: 34px; height: 44px; border-radius: 7px; background: #ffffff; border: 2px solid #ebe9e2; box-shadow: 0 2px 5px rgba(36,48,77,.14); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; flex: 0 0 auto;\">\n          <span style=\"font-family: ui-monospace, monospace; font-size: 8px; font-weight: 700; color: #24304d; align-self: flex-start; margin-left: 4px;\">1<\u002Fspan>\n          <span style=\"display: flex; gap: 2.5px; align-items: flex-end;\">\n            <span style=\"width: 3.5px; height: 13px; border-radius: 999px; background: #3fae57;\"><\u002Fspan>\n            <span style=\"width: 3.5px; height: 18px; border-radius: 999px; background: #1a7a45;\"><\u002Fspan>\n            <span style=\"width: 3.5px; height: 13px; border-radius: 999px; background: #3fae57;\"><\u002Fspan>\n          <\u002Fspan>\n          <span style=\"width: 6px; height: 6px; border-radius: 999px; background: #e0466f;\"><\u002Fspan>\n        <\u002Fspan>\n        <span style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 22px; color: #1a7a45;\">{{ appName }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; align-items: center; gap: 18px; flex-wrap: wrap;\">\n        <a href=\"#how\" style=\"font-size: 15px; font-weight: 700; color: #566274; text-decoration: none;\" style-hover=\"color: #1a7a45;\">How it works<\u002Fa>\n        <a href=\"#clubs\" style=\"font-size: 15px; font-weight: 700; color: #566274; text-decoration: none;\" style-hover=\"color: #1a7a45;\">For clubs<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; gap: 22px; max-width: 680px;\">\n      <h1 style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: clamp(42px, 7vw, 68px); letter-spacing: -.01em; line-height: 1; margin: 0; color: #1a7a45; text-wrap: balance;\">Keep every hand you play.<\u002Fh1>\n      <p style=\"margin: 0; font-size: 19px; line-height: 1.5; color: #5a6473; max-width: 48ch; text-wrap: pretty;\">Log the hand you made from this year's card, watch your season fill in, and see where you rank in your group. Free, and it works on any phone.<\u002Fp>\n      <div style=\"display: flex; gap: 12px; flex-wrap: wrap; align-items: center;\">\n        <button type=\"button\" sc-camel-on-click=\"{{ scrollToApp }}\" style=\"border: none; cursor: pointer; border-radius: 999px; padding: 15px 26px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 16px; font-weight: 700; background: #e0466f; color: #fff9f2; text-decoration: none;\" style-hover=\"background: #c93a5f;\">Open the app<\u002Fbutton>\n        <a href=\"#clubs\" style=\"border: 2.5px solid #cbe9cf; background: #ffffff; cursor: pointer; border-radius: 999px; padding: 13px 24px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 16px; font-weight: 700; color: #1a7a45; text-decoration: none;\" style-hover=\"background: #f1faf2;\">Post your club's events<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"font-size: 14px; line-height: 1.45; font-weight: 600; color: #8a93a3;\">On your phone? Open this page, tap Share, then Add to Home Screen. It opens like an app.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"how\" style=\"display: flex; flex-direction: column; gap: 22px; scroll-margin-top: 24px;\">\n      <div style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05; color: #1a7a45;\">How it works<\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;\">\n      <div style=\"background: #ffffff; border: 2px solid #ebe9e2; border-radius: var(--radius-lg); padding: 22px; display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"width: 34px; height: 42px; border-radius: 7px; background: #3fae57; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 20px;\">1<\u002Fspan>\n        <div style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.1; color: #1a7a45;\">Pick the hand<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.5; color: #5a6473; text-wrap: pretty;\">Choose the line you played from this year's card, by section.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #ffffff; border: 2px solid #ebe9e2; border-radius: var(--radius-lg); padding: 22px; display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"width: 34px; height: 42px; border-radius: 7px; background: #e0466f; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 20px;\">2<\u002Fspan>\n        <div style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.1; color: #1a7a45;\">Say how it went<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.5; color: #5a6473; text-wrap: pretty;\">Mahjong, someone else won, or a wall game. Every game counts toward your season.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background: #ffffff; border: 2px solid #ebe9e2; border-radius: var(--radius-lg); padding: 22px; display: flex; flex-direction: column; gap: 10px;\">\n        <span style=\"width: 34px; height: 42px; border-radius: 7px; background: #a98cd8; color: #ffffff; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 20px;\">3<\u002Fspan>\n        <div style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.1; color: #1a7a45;\">Watch your card fill<\u002Fdiv>\n        <div style=\"font-size: 15px; line-height: 1.5; color: #5a6473; text-wrap: pretty;\">Your hands, Mahjongs and title build up all season. Log to a group to share a leaderboard.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"clubs\" style=\"background: #e8f7e9; border-radius: var(--radius-lg); padding: 30px 28px; display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 24px;\">\n      <span style=\"font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #2f6b45;\">For clubs<\u002Fspan>\n      <div style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05; color: #1a7a45; max-width: 20ch; text-wrap: balance;\">Run a mahjong club? Post your events.<\u002Fdiv>\n      <p style=\"margin: 0; font-size: 16.5px; line-height: 1.55; color: #2f6b45; max-width: 56ch; text-wrap: pretty;\">Approved clubs post game nights, lessons and fundraisers straight to the Events tab, with the date, time, venue, cost and a booking link. Players nearby see them right away. Free while we're getting started.<\u002Fp>\n      <div style=\"display: flex; gap: 12px; flex-wrap: wrap; align-items: center;\">\n        <a href=\"{{ clubHref }}\" style=\"border: none; cursor: pointer; border-radius: 999px; padding: 15px 26px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 16px; font-weight: 700; background: #e0466f; color: #fff9f2; text-decoration: none;\" style-hover=\"background: #c93a5f;\">Ask to post events<\u002Fa>\n        <span style=\"font-size: 14px; font-weight: 600; color: #2f6b45;\">Already approved? Sign in and open Events.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"phoneRow\" style=\"display: flex; gap: 52px; align-items: flex-start; flex-wrap: wrap; justify-content: center;\">\n\n    <div id=\"phoneShell\" style=\"width: 390px; height: 844px; background: #24304d; border-radius: 54px; padding: 11px; box-shadow: 0 20px 44px rgba(36,48,77,.18); flex: 0 0 auto;\">\n      <div id=\"phoneScreen\" style=\"width: 100%; height: 100%; background: #fdfdfb; border-radius: 44px; overflow: hidden; display: flex; flex-direction: column; position: relative;\">\n\n        <sc-if value=\"{{ showOnboard }}\" hint-placeholder-val=\"{{ false }}\">\n          <div yle=\"flex: 1 1 0; border: 2.5px solid #cbe9cf; background: #ffffff; cursor: pointer; border-radius: 999px; padding: 13px 18px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 700; color: #1a7a45;\" style-hover=\"background: #f1faf2;\">Send it again<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ backToEmail }}\" style=\"flex: 1 1 0; border: 2.5px solid #ebe9e2; background: #ffffff; cursor: pointer; border-radius: 999px; padding: 13px 18px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 700; color: #566274;\" style-hover=\"border-color: #d8d4c8;\">Different email<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ stepStart }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 16px;\">\n                <div style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 34px; line-height: 1.05; color: #1a7a45;\">Welcome to My Mahj Card<\u002Fdiv>\n                <div style=\"font-size: 15.5px; line-height: 1.5; color: #5a6473;\">Log the hands you make and see how your season adds up. Playing with others? Join their group and you'll share a leaderboard.<\u002Fdiv>\n                <div style=\"display: flex; flex-direction: column; gap: 10px; margin-top: 4px;\">\n                  <button type=\"button\" sc-camel-on-click=\"{{ goJoin }}\" style=\"border: none; cursor: pointer; border-radius: 999px; padding: 16px 24px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 17px; font-weight: 700; background: #e0466f; color: #fff9f2;\" style-hover=\"background: #c93a5f;\">I have a group code<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ goCreate }}\" style=\"border: 2.5px solid #cbe9cf; cursor: pointer; border-radius: 999px; padding: 15px 24px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 16px; font-weight: 700; background: #ffffff; color: #1a7a45;\" style-hover=\"background: #f1faf2;\">Start a new group<\u002Fbutton>\n                  <button type=\"button\" sc-camel-on-click=\"{{ goSolo }}\" style=\"border: none; background: none; cursor: pointer; padding: 6px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 700; color: #8a93a3; align-self: center;\" style-hover=\"color: #5a6473;\">Just track my own hands<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ stepJoin }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n                <div style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 31px; line-height: 1.05; color: #1a7a45;\">Join a group<\u002Fdiv>\n                <div style=\"font-size: 15.5px; line-height: 1.5; color: #5a6473;\">Enter the code your host gave you.<\u002Fdiv>\n                <input type=\"text\" placeholder=\"Group code\" ref=\"{{ codeRef }}\" sc-camel-on-key-down=\"{{ codeKey }}\" style=\"border: 2.5px solid #cbe9cf; background: #ffffff; border-radius: 999px; padding: 15px 20px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 17px; font-weight: 700; color: #24304d; outline: none; width: 100%; box-sizing: border-box; text-transform: uppercase; letter-spacing: .14em; font-family: ui-monospace, monospace;\">\n                <div style=\"font-size: 14px; font-weight: 700; line-height: 1.45; color: #c93a5f;\">{{ joinErrorText }}<\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ doJoin }}\" style=\"border: none; cursor: pointer; border-radius: 999px; padding: 16px 24px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 17px; font-weight: 700; background: #e0466f; color: #fff9f2;\" style-hover=\"background: #c93a5f;\">{{ joinBtnLabel }}<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ backOut }}\" style=\"border: none; background: none; cursor: pointer; padding: 6px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 700; color: #8a93a3; align-self: center;\" style-hover=\"color: #5a6473;\">Back<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ stepCreate }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n                <div style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 31px; line-height: 1.05; color: #1a7a45;\">Start a group<\u002Fdiv>\n                <div style=\"font-size: 15.5px; line-height: 1.5; color: #5a6473;\">Name it for your game, then share the code with everyone playing.<\u002Fdiv>\n                <input type=\"text\" placeholder=\"Group name\" ref=\"{{ groupRef }}\" sc-camel-on-key-down=\"{{ groupKey }}\" style=\"border: 2.5px solid #cbe9cf; background: #ffffff; border-radius: 999px; padding: 15px 20px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 17px; font-weight: 700; color: #24304d; outline: none; width: 100%; box-sizing: border-box;\">\n                <input type=\"text\" placeholder=\"Where you play\" ref=\"{{ placeRef }}\" style=\"border: 2.5px solid #cbe9cf; background: #ffffff; border-radius: 999px; padding: 15px 20px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 17px; font-weight: 700; color: #24304d; outline: none; width: 100%; box-sizing: border-box;\">\n                <div style=\"font-size: 14px; font-weight: 700; line-height: 1.45; color: #c93a5f;\">{{ joinErrorText }}<\u002Fdiv>\n                <button type=\"button\" sc-camel-on-click=\"{{ doCreate }}\" style=\"border: none; cursor: pointer; border-radius: 999px; padding: 16px 24px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 17px; font-weight: 700; background: #e0466f; color: #fff9f2;\" style-hover=\"background: #c93a5f;\">{{ createBtnLabel }}<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ backOut }}\" style=\"border: none; background: none; cursor: pointer; padding: 6px; font-family: 'Nunito Sans', system-ui, sans-serif; font-size: 14.5px; font-weight: 700; color: #8a93a3; align-self: center;\" style-hover=\"color: #5a6473;\">Back<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ stepName }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n                <sc-if value=\"{{ joinedName }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background: #e8f7e9; border: 2px solid #cbe9cf; border-radius: var(--radius-md); padding: 13px 16px; display: flex; flex-direction: column; gap: 2px;\">\n                    <span style=\"font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #1a7a45;\">Joining<\u002Fspan>\n                    <span style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 21px; line-height: 1.1; color: #24304d;\">{{ joinedName }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 700; font-size: 31px; line-height: 1.05; color: #1a7a45;\">What's your name?<\u002Fdiv>\n                <div style=\"font-size: 15.5px; line-height: 1.5; color: #5a6473;\">This is how you'll show up on the leaderboard.<\u002Fdiv>\n                <input type=\"text\" placeholder=\"Your name\" ref=\"{{ nameRef }}\" sc-camel-on-key-down=\"{{ nameKey }}\" sc-camel-on-input=\"{{ nameChange }}\" sc-camel-on-change=\"{{ nameChange }}\" style=\"border: 2.5px solid #cbe9cf; background: #ffffff; border-radius: 999px; padding: 15px 20px; font-family: 'Nunito Sans n synchronously at every session change; state lags a tick\n  // behind it, and calls made during sign-in would otherwise use the anon key.\n  sbHeaders(extra) {\n    const live = this.sess || (this.state && this.state.session);\n    const tok = (live && live.token) || this.SB_KEY;\n    return Object.assign({\n      apikey: this.SB_KEY,\n      Authorization: \"Bearer \" + tok,\n      \"Content-Type\": \"application/json\"\n    }, extra || {});\n  }\n\n  authPost(path, body) {\n    return fetch(this.AUTH_URL + path, {\n      method: \"POST\",\n      headers: { apikey: this.SB_KEY, \"Content-Type\": \"application/json\" },\n      body: JSON.stringify(body)\n    }).then(r => r.json().then(j => {\n      if (!r.ok) throw new Error((j && (j.msg || j.error_description || j.message)) || (\"auth \" + r.status));\n      return j;\n    }));\n  }\n\n  readSession() {\n    try { return JSON.parse(localStorage.getItem(this.SESSION) || \"null\"); } catch (e) { return null; }\n  }\n  writeSession(sess) {\n    this.sess = sess || null;\n    try {\n      if (sess) localStorage.setItem(this.SESSION, JSON.stringify(sess));\n      else localStorage.removeItem(this.SESSION);\n    } catch (e) {}\n  }\n\n  sendCode() {\n    const email = String(this.state.authEmail || \"\").trim();\n    if (!/.+@.+\\..+/.test(email)) return this.setState({ authErr: \"That email doesn't look right.\" });\n    // App Review account signs in with a fixed code (its Supabase password) instead of an emailed one\n    if (email.toLowerCase() === REVIEW_EMAIL) return this.setState({ authStep: \"code\", authErr: \"\" });\n    this.setState({ authBusy: true, authErr: \"\" });\n    this.authPost(\"/otp\", { email: email, create_user: true })\n      .then(() => this.setState({ authBusy: false, authStep: \"code\" }))\n      .catch(e => this.setState({ authBusy: false, authErr: \"Couldn't send the code. \" + e.message }));\n  }\n\n  verifyCode() {\n    const email = String(this.state.authEmail || \"\").trim();\n    const token = String(this.state.authCode || \"\").replace(/\\s+/g, \"\");\n    if (token.length < 6) return this.setState({ authErr: \"Enter the six digits from the email.\" });\n    this.setState({ authBusy: true, authErr: \"\" });\n    const review = email.toLowerCase() === REVIEW_EMAIL;\n    (review\n      ? this.authPost(\"/token?grant_type=password\", { email: REVIEW_EMAIL, password: token })\n      : this.authPost(\"/verify\", { email: email, token: token, type: \"email\" }))\n      .then(res => {\n        const sess = {\n          token: res.access_token,\n          refresh: res.refresh_token,\n          uid: res.user && res.user.id,\n          email: (res.user && res.user.email) || email,\n          expires: Date.now() + ((res.expires_in || 3600) * 1000)\n        };\n        this.writeSession(sess);\n        this.setState({ session: sess, authBusy: false, authCode: \"\", authStep: \"email\" });\n        setTimeout(() => this.setupPush(), 1200);\n        return this.afterSignIn(sess);\n      })\n      .catch(e => this.setState({ authBusy: false, authErr: \"That code didn't work. \" + e.message }));\n  }\n\n  refreshSession(sess) {\n    return this.authPost(\"/token?grant_type=refresh_token\", { refresh_token: sess.refresh })\n      .then(res => {\n        const next = {\n          token: res.access_token, refresh: res.refresh_token,\n          uid: (res.user && res.user.id) || sess.uid,\n          email: (res.user && res.user.email) || sess.email,\n          expires: Date.now() + ((res.expires_in || 3600) * 1000)\n        };\n        this.writeSession(next);\n        this.setState({ session: next });\n        return next;\n      });\n  }\n\n  deleteAccount() {\n    const sess = this.sess || this.state.session;\n    if (!sess || !sess.uid || this.state.deleting) return;\n    if (!window.confirm(\"Delete your My Mahj Card account? Your card, hands and group memberships will be permanently removed.\")) return;\n    this.setState({ deleting: true, deleteErr: \"\" });\ nt_id] = r.id; });\n            this.setState(st => ({\n              groups: evs || st.groups,\n              playerIds: Object.assign({}, st.playerIds || {}, map),\n              event: st.event || (evs && evs[0]) || null,\n              playerId: st.playerId || (evs && evs[0] ? map[evs[0].id] : null)\n            }));\n            setTimeout(() => this.tick(), 0);\n          });\n      })\n      .catch(() => {});\n  }\n\n  saveProfile(now) {\n    const s = this.state;\n    if (!s.session || !s.session.uid) return;\n    if (this.profileTimer) clearTimeout(this.profileTimer);\n    const run = () => {\n      const st = this.state;\n      if (!st.session || !st.session.uid) return;\n      this.sbPost(\"/profiles?on_conflict=user_id\", {\n        user_id: st.session.uid,\n        name: st.playerName,\n        data: this.snapshot(),\n        updated_at: new Date().toISOString()\n      }, { Prefer: \"resolution=merge-duplicates,return=minimal\" }).catch(() => {});\n    };\n    if (now) run(); else this.profileTimer = setTimeout(run, 1800);\n  }\n\n  snapshot() {\n    const s = this.state;\n    return {\n      mahjs: s.mahjs, lifetime: s.lifetime, games: s.games,\n      handsMade: s.handsMade, streak: s.streak, rsvped: s.rsvped, log: s.log,\n      playerName: s.playerName, playerId: s.playerId, event: s.event, cardId: s.cardId,\n      groups: s.groups, playerIds: s.playerIds,\n      going: s.going, played: s.played, plans: s.plans, planGroupId: s.planGroupId,\n      planRsvp: s.planRsvp, logTo: s.logTo\n    };\n  }\n\n  sbGet(path) {\n    return fetch(this.SB_URL + path, { headers: this.sbHeaders() })\n      .then(r => { if (!r.ok) throw new Error(\"GET \" + r.status); return r.json(); });\n  }\n\n  sbPost(path, body, extraHeaders) {\n    return fetch(this.SB_URL + path, {\n      method: \"POST\",\n      headers: this.sbHeaders(extraHeaders || { Prefer: \"return=minimal\" }),\n      body: JSON.stringify(body)\n    }).then(r => { if (!r.ok) throw new Error(\"POST \" + r.status); });\n  }\n\n  sbDelete(path) {\n    return fetch(this.SB_URL + path, {\n      method: \"DELETE\",\n      headers: this.sbHeaders({ Prefer: \"return=minimal\" })\n    }).then(r => { if (!r.ok) throw new Error(\"DELETE \" + r.status); });\n  }\n\n  eventCode() {\n    try {\n      const q = new URLSearchParams(location.search).get(\"e\");\n      if (q) return q.toUpperCase();\n      const m = location.pathname.match(/\\/e\\/([A-Za-z0-9]+)/);\n      if (m) return m[1].toUpperCase();\n    } catch (e) {}\n    return \"OMAHA\";\n  }\n\n  readPending() {\n    try { return JSON.parse(localStorage.getItem(this.PENDING) || \"[]\"); } catch (e) { return []; }\n  }\n  writePending(list) {\n    try { localStorage.setItem(this.PENDING, JSON.stringify(list)); } catch (e) {}\n  }\n\n  flush() {\n    const step = () => {\n      const list = this.readPending();\n      if (!list.length) return Promise.resolve();\n      return this.sbPost(\"/logs\", list[0]).then(() => {\n        const rest = this.readPending();\n        rest.shift();\n        this.writePending(rest);\n        return step();\n      });\n    };\n    return step();\n  }\n\n  loadBoard(eventId) {\n    return Promise.all([\n      this.sbGet(\"/players?event_id=eq.\" + eventId + \"&select=id,name\"),\n      this.sbGet(\"/logs?event_id=eq.\" + eventId + \"&made=eq.true&select=player_id,at,section,row_num\")\n    ]).then(res => {\n      const players = res[0], logs = res[1];\n      return players.map(p => {\n        const mine = logs.filter(l => l.player_id === p.id);\n        const tally = list => {\n          let m = 0, pts = 0;\n          list.forEach(l => {\n            m++;\n            const parsed = this.parseRemoteSection(l.section);\n            pts += this.ptsFor(parsed.cardId, parsed.name, l.row_num);\n          });\n          return { mahjs: m, points: pts };\n        };\n        const all = tally(mine);\n        const night = tally(mine.filter(l => this.isToday(l.at)));\n        return { id: p.id, name: p.name, mahjs: all.mahjs, points: all.points, nightMahjs: night.mahjs, nightPoints: night.points };\n      });\n    });\n  }\n\n  tileSet(pattern) {\n    const out = {};\n    String(pattern).toUpperCase().replace(/[^0-9NEWSDF+]/g, \"\").split(\"\").forEach(ch => {\n      if (ch === \"F\" || ch === \"+\") return;\n      out[ch] = 1;\n    });\n    return out;\n  }\n\n  openingOf(pattern) {\n    const m = String(pattern).toUpperCase().match(/^(F+)/);\n    return m ? m[1].length : 0;\n  }\n\n  similarTo(cardId, sectionName, rowIdx) {\n    const card = CARDS.filter(x => x.id === cardId)[0];\n    if (!card) return [];\n    const sec = card.sections.filter(x => x.name === sectionName)[0];\n    if (!sec) return [];\n    const base = sec.hands[rowIdx];\n    if (!base) return [];\n    const baseTiles = this.tileSet(base.pattern);\n    const baseKeys = Object.keys(baseTiles);\n    const baseOpen = this.openingOf(base.pattern);\n\n    const out = [];\n    card.sections.forEach(x => {\n      x.hands.forEach((h, i) => {\n        if (x.name === sectionName && i === rowIdx) return;\n        const t = this.tileSet(h.pattern);\n        let shared = 0;\n        baseKeys.forEach(k => { if (t[k]) shared++; });\n        const open = this.openingOf(h.pattern);\n        const sameOpen = baseOpen > 0 && open > 0;\n        const score = shared * 2 + (sameOpen ? 1 : 0) + (open === baseOpen && baseOpen > 0 ? 1 : 0);\n        const sameSection = x.name === sectionName;\n        const why = [];\n        if (sameOpen) why.push(open === baseOpen ? (baseOpen === 1 ? \"flower too\" : baseOpen + \" flowers too\") : \"flowers too\");\n        const sharedKeys = baseKeys.filter(k => t[k]);\n        if (sharedKeys.length) why.push(\"shares \" + sharedKeys.slice(0, 4).join(\", \"));\n        if (!why.length) why.push(sameSection ? \"same section\" : \"no tiles in common\");\n        out.push({\n          key: x.name + \"|\" + (i + 1),\n          section: x.name,\n          num: String(i + 1),\n          pa
